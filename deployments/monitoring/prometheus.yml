global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'airport-services-dev'
    environment: 'development'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Flight Service
  - job_name: 'flight-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['flight-service:8081']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'flight-service'

  # Booking Service
  - job_name: 'booking-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['booking-service:8082']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'booking-service'

  # Passenger Service
  - job_name: 'passenger-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['passenger-service:8083']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'passenger-service'

  # Payment Service
  - job_name: 'payment-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['payment-service:8084']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'payment-service'

  # Check-in Service
  - job_name: 'checkin-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['checkin-service:8085']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'checkin-service'

  # Baggage Service
  - job_name: 'baggage-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['baggage-service:8086']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'baggage-service'

  # Notification Service
  - job_name: 'notification-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['notification-service:8087']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'notification-service'

  # Auth Service
  - job_name: 'auth-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['auth-service:8088']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'auth-service'

  # API Gateway
  - job_name: 'api-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api-gateway:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'api-gateway'

  # PostgreSQL Exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # RabbitMQ Exporter
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']

  # Node Exporter (for host metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
