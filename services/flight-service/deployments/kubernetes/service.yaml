apiVersion: v1
kind: Service
metadata:
  name: flight-service
  namespace: airport-services
  labels:
    app: flight-service
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: flight-service
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: flight-service-headless
  namespace: airport-services
  labels:
    app: flight-service
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: flight-service
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
