apiVersion: v1
kind: ConfigMap
metadata:
  name: flight-service-config
  namespace: airport-services
  labels:
    app: flight-service
data:
  # Database Configuration
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "flight_db"
  DB_USER: "flight_user"
  DB_SSLMODE: "require"
  DB_MAX_OPEN_CONNS: "25"
  DB_MAX_IDLE_CONNS: "5"
  DB_CONN_MAX_LIFETIME: "5m"
  DB_CONN_MAX_IDLE_TIME: "5m"

  # Redis Configuration
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_MAX_RETRIES: "3"
  REDIS_POOL_SIZE: "10"
  REDIS_MIN_IDLE_CONNS: "2"

  # RabbitMQ Configuration
  RABBITMQ_URL: "amqp://rabbitmq-service:5672/"
  RABBITMQ_EXCHANGE: "airport-events"
  RABBITMQ_EXCHANGE_TYPE: "topic"

  # Server Configuration
  SERVER_READ_TIMEOUT: "15s"
  SERVER_WRITE_TIMEOUT: "15s"
  SERVER_SHUTDOWN_TIMEOUT: "30s"
  SERVER_MAX_REQUEST_SIZE: "10485760"  # 10MB

  # Logging Configuration
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"

  # Tracing Configuration
  TRACING_ENABLED: "true"
  TRACING_SERVICE_NAME: "flight-service"
  JAEGER_URL: "http://jaeger-collector:14268/api/traces"
  TRACING_SAMPLE_RATE: "0.1"

  # Metrics Configuration
  METRICS_ENABLED: "true"
  METRICS_PATH: "/metrics"

  # JWT Configuration
  JWT_EXPIRATION: "24h"
  JWT_ISSUER: "airport-services"
---
apiVersion: v1
kind: Secret
metadata:
  name: flight-service-secrets
  namespace: airport-services
  labels:
    app: flight-service
type: Opaque
stringData:
  # Database password (should be from sealed secrets or external secret manager in production)
  DB_PASSWORD: "changeme"

  # Redis password
  REDIS_PASSWORD: ""

  # JWT secret (should be strong random string in production)
  JWT_SECRET: "your-secret-key-change-in-production"
