version: '3.8'

services:
  # PostgreSQL - Primary relational database
  postgres:
    image: postgres:15-alpine
    container_name: airport-postgres
    environment:
      POSTGRES_USER: airport
      POSTGRES_PASSWORD: airport123
      POSTGRES_DB: airport
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airport"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airport-network

  # MongoDB - Document database for flexible schemas
  mongodb:
    image: mongo:7
    container_name: airport-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: airport
      MONGO_INITDB_ROOT_PASSWORD: airport123
      MONGO_INITDB_DATABASE: airport
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airport-network

  # Redis - Caching and session storage
  redis:
    image: redis:7-alpine
    container_name: airport-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass airport123
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airport-network

  # RabbitMQ - Message broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: airport-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: airport
      RABBITMQ_DEFAULT_PASS: airport123
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airport-network

  # Elasticsearch - Search and analytics
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: airport-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - airport-network

  # Kibana - Elasticsearch UI
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: airport-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - airport-network

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: airport-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - airport-network

  # Grafana - Metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: airport-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployments/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./deployments/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - airport-network

  # Jaeger - Distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: airport-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: true
    ports:
      - "5775:5775/udp"   # Zipkin compact
      - "6831:6831/udp"   # Jaeger compact
      - "6832:6832/udp"   # Jaeger binary
      - "5778:5778"       # Configs
      - "16686:16686"     # UI
      - "14250:14250"     # Model proto
      - "14268:14268"     # Jaeger collector
      - "14269:14269"     # Admin port
      - "4317:4317"       # OTLP gRPC
      - "4318:4318"       # OTLP HTTP
      - "9411:9411"       # Zipkin
    networks:
      - airport-network

  # Consul - Service discovery and configuration
  consul:
    image: consul:latest
    container_name: airport-consul
    ports:
      - "8500:8500"  # HTTP API
      - "8600:8600"  # DNS
    command: agent -server -ui -bootstrap-expect=1 -client=0.0.0.0
    volumes:
      - consul_data:/consul/data
    networks:
      - airport-network

  # pgAdmin - PostgreSQL admin UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: airport-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@airport.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - airport-network

  # Mailhog - Email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: airport-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # UI
    networks:
      - airport-network

  # MinIO - S3-compatible object storage
  minio:
    image: minio/minio:latest
    container_name: airport-minio
    environment:
      MINIO_ROOT_USER: airport
      MINIO_ROOT_PASSWORD: airport123
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - airport-network

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  elasticsearch_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  consul_data:
    driver: local
  minio_data:
    driver: local

networks:
  airport-network:
    driver: bridge
    name: airport-network
